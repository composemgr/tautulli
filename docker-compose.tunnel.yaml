name: tautulli
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
      CONTAINER_NAME: tautulli-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/config/tautulli:/config'
      - './volumes/data/tautulli:/data'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8181']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://tautulli-app:8181'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - tautulli
      - cloudflare

networks:
  tautulli:
    name: tautulli
    external: false
  cloudflare:
    external: true
